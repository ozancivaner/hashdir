name: Lint

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y ssdeep python3-ssdeep libtlsh4 python3-tlsh python3-pefile || true
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Linter
      run: make check
